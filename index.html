let lang = localStorage.getItem('pixelArt_lang') || 'zh';
function t(key) { return i18n[lang]?.[key] || key; }
function switchLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('pixelArt_lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  updateAllTexts();
  showToast(lang === 'zh' ? '已切换为中文' : 'Switched to English');
}

function selectLanguage(selectedLang) {
  lang = selectedLang;
  localStorage.setItem('pixelArt_lang', lang);
  localStorage.setItem('pixelArt_langChosen', 'true');
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  updateAllTexts();
  initBrushDots();
  document.getElementById('lang-select-overlay').classList.add('hidden');
  // Ensure we have a canvas and are in editor for the tutorial
  if (!state.pixels || state.pixels.length === 0) {
    initPixels(64, 64, '#FFFFFF');
    state.zoom = 8;
    resizeCanvas();
    renderCanvas();
    setZoom(state.zoom);
  }
  goToEditor();
  // Start tutorial after transition
  setTimeout(() => startTutorial(), 500);
}
function updateAllTexts() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (el.tagName === 'INPUT' && el.type === 'checkbox') {
      const span = el.nextElementSibling;
      if (span) span.textContent = t(key);
    } else if (el.hasAttribute('data-i18n-title')) {

    } else {
      el.textContent = t(key);
    }
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.getAttribute('data-i18n-title'));
  });
  document.title = t('appTitle') + ' | Pixel Studio';
  document.getElementById('loading-text').textContent = t('loadingCat');
  // Update gallery header
  const galleryLogo = document.querySelector('#gallery-header .logo');
  if (galleryLogo) galleryLogo.innerHTML = '<span>🐱</span> ' + t('appTitle');
  // Update editor header
  const headerLogo = document.querySelector('#header .logo');
  if (headerLogo) headerLogo.innerHTML = '<span>🐱</span> ' + t('appTitle');
  renderPresetSwatches();
  // Refresh gallery if visible
  if (state.currentPage === 'gallery') renderGallery();
}

// ================================================================
//  STATE — 应用状态
// ================================================================
const state = {
  canvasWidth: 64,
  canvasHeight: 64,
  pixels: [],            // [row][col] → "#rrggbb" or null (transparent/white)
  currentColor: '#000000',
  currentTool: 'pen',
  brushSize: 1,          // 1~4 pixels
  zoom: 8,
  showGrid: true,
  history: [],           // stack of pixel snapshots
  historyIndex: -1,
  currentWorkId: null,   // id of currently loaded saved work (null = unnamed)
  bgColor: '#FFFFFF',    // canvas background
  currentPage: 'gallery', // 'gallery' | 'editor'
};

// ================================================================
//  DOM REFS
// ================================================================
const $loading = document.getElementById('loading-screen');
const $mainCanvas = document.getElementById('main-canvas');
const $canvasArea = document.getElementById('canvas-area');
const $currentColorDisplay = document.getElementById('current-color-display');
const $mobileColorDisplay = document.getElementById('mobile-current-color');
const $customColorInput = document.getElementById('custom-color-input');
const $mobileColorInput = document.getElementById('mobile-color-input');
const $gridToggle = document.getElementById('grid-toggle');
const $infoSize = document.getElementById('info-size');
const $dialogOverlay = document.getElementById('dialog-overlay');
const $dialogContent = document.getElementById('dialog-content');
const $toast = document.getElementById('toast');
const $tutorialOverlay = document.getElementById('tutorial-overlay');

const $mobilePalette = document.getElementById('mobile-palette');

// ================================================================
//  COLOR PALETTE
// ================================================================
const presetColors = {
  basic:   ['#000000','#FFFFFF','#808080','#FF0000','#FF8800','#FFDD00','#00CC00','#0088FF','#8800CC','#8B4513','#FF69B4','#00CCCC','#FF4444','#4444FF','#228B22'],
  warm:    ['#FFE4C4','#FFDAB9','#FFCBA4','#FFB088','#FF9A6C','#FFD700','#FFC107','#FF9800','#FF7F50','#FF6347','#FFD1DC','#FFB6C1','#FFC0CB','#FF91A4','#E8A850'],
  nature:  ['#87CEEB','#5DADE2','#48C9B0','#52BE80','#27AE60','#F5DEB3','#DEB887','#D2B48C','#A0522D','#6B4226','#8FBC8F','#6B8E23','#556B2F','#4682B4','#708090'],
};

function renderPresetSwatches() {

function updateSwatchSelection() {

function setColor(color) {

  $currentColorDisplay.style.background = color;
  if ($mobileColorDisplay) $mobileColorDisplay.style.background = color;
  $customColorInput.value = color;
  if ($mobileColorInput) $mobileColorInput.value = color;

// ================================================================
//  CANVAS INIT & RENDERING
// ================================================================
function initPixels(width, height, bgColor) {
  state.canvasWidth = width;
  state.canvasHeight = height || width;
  state.bgColor = bgColor || '#FFFFFF';
  state.pixels = [];
  for (let r = 0; r < state.canvasHeight; r++) {
    state.pixels[r] = new Array(state.canvasWidth).fill(null);
  }
  state.history = [];
  state.historyIndex = -1;
  state.currentWorkId = null;
  state.brushSize = 1;
  saveHistory();
}

function resizeCanvas() {
  const w = state.canvasWidth * state.zoom;
  const h = state.canvasHeight * state.zoom;
  $mainCanvas.width = w;
  $mainCanvas.height = h;
  $mainCanvas.style.width = w + 'px';
  $mainCanvas.style.height = h + 'px';
  $infoSize.textContent = state.canvasWidth + '×' + state.canvasHeight;
}

function renderCanvas() {
  const ctx = $mainCanvas.getContext('2d');
  const { canvasWidth, canvasHeight, pixels, zoom, showGrid, bgColor } = state;

  // Background
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvasWidth * zoom, canvasHeight * zoom);

  // Pixels
  for (let r = 0; r < canvasHeight; r++) {
    for (let c = 0; c < canvasWidth; c++) {
      if (pixels[r]?.[c]) {
        ctx.fillStyle = pixels[r][c];
        ctx.fillRect(c * zoom, r * zoom, zoom, zoom);
      }
    }
  }

  // Grid lines
  if (showGrid && zoom >= 4) {
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= canvasWidth; i++) {
      ctx.moveTo(i * zoom + 0.5, 0);
      ctx.lineTo(i * zoom + 0.5, canvasHeight * zoom);
    }
    for (let i = 0; i <= canvasHeight; i++) {
      ctx.moveTo(0, i * zoom + 0.5);
      ctx.lineTo(canvasWidth * zoom, i * zoom + 0.5);
    }
    ctx.stroke();
  }
}

// ================================================================
//  COORDINATE MAPPING
// ================================================================
function getPixelFromEvent(e) {
  const rect = $mainCanvas.getBoundingClientRect();
  const scaleX = $mainCanvas.width / rect.width;
  const scaleY = $mainCanvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  const col = Math.floor(x / state.zoom);
  const row = Math.floor(y / state.zoom);
  if (col < 0 || col >= state.canvasWidth || row < 0 || row >= state.canvasHeight) return null;
  return { row, col };
}

// ================================================================
//  TOOLS
// ================================================================
function switchTool(tool) {
  state.currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tool') === tool);
  });
}

function setBrushSize(size) {
  state.brushSize = size;
  document.querySelectorAll('.brush-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.getAttribute('data-size')) === size);
  });
}

function initBrushDots() {
  document.querySelectorAll('.brush-btn').forEach(btn => {
    const s = parseInt(btn.getAttribute('data-size'));
    const grid = document.createElement('div');
    grid.className = 'brush-dot-grid';
    grid.style.gridTemplateColumns = 'repeat(' + s + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + s + ', 1fr)';
    grid.style.width = (s * 8 + (s - 1) * 2) + 'px';
    grid.style.height = (s * 8 + (s - 1) * 2) + 'px';
    for (let i = 0; i < s * s; i++) {
      const dot = document.createElement('div');
      dot.className = 'brush-dot';
      grid.appendChild(dot);
    }
    btn.innerHTML = '';
    btn.appendChild(grid);
  });
}

function drawAt(row, col) {
  const b = state.brushSize;
  let changed = false;
  if (state.currentTool === 'pen') {
    for (let dr = 0; dr < b; dr++) {
      for (let dc = 0; dc < b; dc++) {
        const r = row + dr, c = col + dc;
        if (r >= 0 && r < state.canvasHeight && c >= 0 && c < state.canvasWidth) {
          if (state.pixels[r][c] !== state.currentColor) {
            state.pixels[r][c] = state.currentColor;
            changed = true;
          }
        }
      }
    }
  } else if (state.currentTool === 'eraser') {
    for (let dr = 0; dr < b; dr++) {
      for (let dc = 0; dc < b; dc++) {
        const r = row + dr, c = col + dc;
        if (r >= 0 && r < state.canvasHeight && c >= 0 && c < state.canvasWidth) {
          if (state.pixels[r][c] !== null) {
            state.pixels[r][c] = null;
            changed = true;
          }
        }
      }
    }
  }
  return changed;
}

function useToolAt(row, col) {
  if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
    return drawAt(row, col);
  } else if (state.currentTool === 'fill') {
    saveHistory();
    floodFill(col, row, state.currentColor);
    renderCanvas();
    autoSave();
    return true;
  } else if (state.currentTool === 'picker') {
    const c = state.pixels[row]?.[col];
    if (c) setColor(c);
    return false;
  }
  return false;
}

// ================================================================
//  FLOOD FILL (BFS)
// ================================================================
function floodFill(startCol, startRow, newColor) {
  const targetColor = state.pixels[startRow]?.[startCol];
  // Treat null as "background" filling
  const target = targetColor || null;
  if (target === newColor) return;

  const w = state.canvasWidth, h = state.canvasHeight;
  const queue = [[startCol, startRow]];
  const visited = new Set();
  visited.add(startRow * w + startCol);

  while (queue.length > 0) {
    const [c, r] = queue.shift();
    const current = state.pixels[r]?.[c] || null;
    if (current !== target) continue;
    state.pixels[r][c] = newColor;
    // Four neighbors
    const neighbors = [[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
    for (const [nc, nr] of neighbors) {
      if (nc >= 0 && nc < w && nr >= 0 && nr < h) {
        const key = nr * w + nc;
        if (!visited.has(key)) {
          visited.add(key);
          queue.push([nc, nr]);
        }
      }
    }
  }
}

// ================================================================
//  HISTORY (UNDO / REDO)
// ================================================================
function saveHistory() {
  // Clone current pixels
  const snapshot = state.pixels.map(row => [...row]);
  // Remove any "future" states
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(snapshot);
  // Limit to 50
  if (state.history.length > 50) state.history.shift();
  state.historyIndex = state.history.length - 1;
}

function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  state.pixels = state.history[state.historyIndex].map(row => [...row]);
  renderCanvas();
  autoSave();
}

function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  state.pixels = state.history[state.historyIndex].map(row => [...row]);
  renderCanvas();
  autoSave();
}

// ================================================================
//  ZOOM & GRID
// ================================================================
function setZoom(z) {
  state.zoom = z;
  resizeCanvas();
  renderCanvas();
  // Scroll canvas to center
  $canvasArea.scrollTo({
    left: ($mainCanvas.width - $canvasArea.clientWidth) / 2,
    top: ($mainCanvas.height - $canvasArea.clientHeight) / 2,
  });
  document.querySelectorAll('#footer .zoom-btns button').forEach(b => {
    b.classList.toggle('current', parseInt(b.getAttribute('data-zoom')) === z);
  });
  autoSave();
}

function toggleGrid() {
  state.showGrid = $gridToggle.checked;
  renderCanvas();
}

// ================================================================
//  EXPORT
// ================================================================
function exportPNG() {
  const w = state.canvasWidth, h = state.canvasHeight;
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = w;
  exportCanvas.height = h;
  const ctx = exportCanvas.getContext('2d');

  // Background
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, w, h);

  // Pixels at 1x scale
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (state.pixels[r]?.[c]) {
        ctx.fillStyle = state.pixels[r][c];
        ctx.fillRect(c, r, 1, 1);
      }
    }
  }

  // Download
  const now = new Date();
  const ts = now.getFullYear() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0') + '-' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0') +
    String(now.getSeconds()).padStart(2,'0');
  exportCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pixel-art-' + ts + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(t('toastExported'));
  }, 'image/png');
}

// ================================================================
//  SAVE / LOAD (localStorage)
// ================================================================
function autoSave() {
  try {
    const data = {
      canvasWidth: state.canvasWidth,
      canvasHeight: state.canvasHeight,
      pixels: state.pixels,
      currentColor: state.currentColor,
      zoom: state.zoom,
      showGrid: state.showGrid,
      bgColor: state.bgColor,
      brushSize: state.brushSize,
      currentWorkId: state.currentWorkId,
      history: state.history,
      historyIndex: state.historyIndex,
    };
    localStorage.setItem('pixelArt_autoSave', JSON.stringify(data));
  } catch(e) { /* storage full, ignore */ }
}

function restoreAutoSave() {
  try {
    const raw = localStorage.getItem('pixelArt_autoSave');
    if (!raw) return false;
    const data = JSON.parse(raw);
    // Backward compat: old format had canvasSize (single number)
    if (data.canvasSize && !data.canvasWidth) {
      state.canvasWidth = data.canvasSize;
      state.canvasHeight = data.canvasSize;
    } else {
      state.canvasWidth = data.canvasWidth || 64;
      state.canvasHeight = data.canvasHeight || 64;
    }
    state.pixels = data.pixels || [];
    state.currentColor = data.currentColor || '#000000';
    state.zoom = data.zoom || 8;
    state.showGrid = data.showGrid !== false;
    state.bgColor = data.bgColor || '#FFFFFF';
    state.brushSize = data.brushSize || 1;
    state.currentWorkId = data.currentWorkId || null;
    state.history = data.history || [];
    state.historyIndex = data.historyIndex ?? -1;
    return true;
  } catch(e) { return false; }
}

function saveWork() {
  // Check limit
  const works = getSavedWorks();
  if (works.length >= 20 && !state.currentWorkId) {
    showToast(t('savedLimit'));
    return;
  }

  // Show name dialog
  showDialog(t('dialogSaveTitle'), `
    <label>${t('dialogSaveName')}</label>
    <input type="text" id="save-name-input" placeholder="${t('dialogSavePlaceholder')}" value="${state.currentWorkId ? (works.find(w=>w.id===state.currentWorkId)?.name||'') : ''}" maxlength="30">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeDialog()">${t('dialogCancel')}</button>
      <button class="btn-confirm" id="save-confirm-btn">${t('dialogConfirm')}</button>
    </div>
  `, () => {
    const nameInput = document.getElementById('save-name-input');
    const confirmBtn = document.getElementById('save-confirm-btn');
    if (!nameInput) return;
    nameInput.focus();
    nameInput.select();
    confirmBtn.onclick = () => doSave(nameInput.value.trim());
    nameInput.onkeydown = (e) => { if (e.key === 'Enter') doSave(nameInput.value.trim()); };
  });
}

function doSave(name) {
  if (!name) name = '未命名 ' + new Date().toLocaleDateString('zh-CN');
  const works = getSavedWorks();
  const id = state.currentWorkId || String(Date.now());
  const existing = works.findIndex(w => w.id === id);

  const work = {
    id,
    name,
    canvasWidth: state.canvasWidth,
    canvasHeight: state.canvasHeight,
    pixels: state.pixels,
    bgColor: state.bgColor,
    brushSize: state.brushSize,
    createdAt: existing >= 0 ? works[existing].createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };

  if (existing >= 0) works[existing] = work;
  else works.push(work);

  localStorage.setItem('pixelArt_savedWorks', JSON.stringify(works));
  state.currentWorkId = id;
  autoSave();
  closeDialog();
  showToast(t('toastSaved'));
}

function getSavedWorks() {
  try {
    return JSON.parse(localStorage.getItem('pixelArt_savedWorks') || '[]');
  } catch(e) { return []; }
}

function openLoadDialog() {
  const works = getSavedWorks();
  let html = '<h3>' + t('savedTitle') + '</h3>';

  if (works.length === 0) {
    html += '<p style="text-align:center;color:var(--text-light);white-space:pre-line;">' + t('savedEmpty') + '</p>';
  } else {
    html += '<div id="saved-list">';
    works.slice().reverse().forEach(w => {
      const date = new Date(w.updatedAt);
      const dateStr = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      html += '<div class="saved-item" data-id="' + w.id + '">' +
        '<canvas width="50" height="50" class="thumb"></canvas>' +
        '<div class="info"><div class="name">' + escHtml(w.name) + '</div>' +
        '<div class="date">' + (w.canvasWidth || w.canvasSize || 64) + '×' + (w.canvasHeight || w.canvasSize || 64) + ' · ' + dateStr + '</div></div>' +
        '<button class="del-btn" data-del="' + w.id + '">' + t('delete') + '</button>' +
        '</div>';
    });
    html += '</div>';
  }

  html += '<div class="btn-row"><button class="btn-cancel" onclick="closeDialog()">' + t('dialogCancel') + '</button></div>';

  showDialog('', html, () => {
    // Render thumbnails
    document.querySelectorAll('.saved-item').forEach(item => {
      const wid = item.getAttribute('data-id');
      const w = works.find(x => x.id === wid);
      if (!w) return;
      const thumb = item.querySelector('canvas.thumb');
      if (!thumb) return;
      renderThumb(thumb, w);
      // Load on item click (but not on del button)
      item.onclick = (e) => {
        if (e.target.closest('.del-btn')) return;
        loadWork(wid);
      };
    });
    // Delete buttons
    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        deleteWork(btn.getAttribute('data-del'));
      };
    });
  });
}

function renderThumb(canvas, work) {
  const ctx = canvas.getContext('2d');
  // Backward compat: old format had canvasSize
  const w = work.canvasWidth || work.canvasSize || 64;
  const h = work.canvasHeight || work.canvasSize || 64;
  const thumbSize = 50;
  const scaleX = thumbSize / w, scaleY = thumbSize / h;
  const scale = Math.min(scaleX, scaleY);
  const offsetX = (thumbSize - w * scale) / 2;
  const offsetY = (thumbSize - h * scale) / 2;
  ctx.fillStyle = work.bgColor || '#FFFFFF';
  ctx.fillRect(0, 0, thumbSize, thumbSize);
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (work.pixels[r]?.[c]) {
        ctx.fillStyle = work.pixels[r][c];
        ctx.fillRect(offsetX + c * scale, offsetY + r * scale, Math.ceil(scale), Math.ceil(scale));
      }
    }
  }
}

function loadWork(id) {
  const works = getSavedWorks();
  const w = works.find(x => x.id === id);
  if (!w) return;
  // Backward compat: old format had canvasSize
  state.canvasWidth = w.canvasWidth || w.canvasSize || 64;
  state.canvasHeight = w.canvasHeight || w.canvasSize || 64;
  state.pixels = w.pixels;
  state.bgColor = w.bgColor || '#FFFFFF';
  state.brushSize = w.brushSize || 1;
  state.currentWorkId = w.id;
  state.history = [state.pixels.map(row => [...row])];
  state.historyIndex = 0;
  state.zoom = Math.max(4, Math.min(16, Math.floor(512 / Math.max(state.canvasWidth, state.canvasHeight))));
  $gridToggle.checked = state.showGrid;
  resizeCanvas();
  renderCanvas();
  setZoom(state.zoom);
  closeDialog();
  autoSave();
  showToast(t('toastLoaded'));
}

function deleteWork(id) {
  showDialog(t('dialogDeleteTitle'), `
    <p style="text-align:center;">${t('dialogDeleteMsg')}</p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeDialog()">${t('dialogCancel')}</button>
      <button class="btn-danger" id="delete-confirm-btn">${t('delete')}</button>
    </div>
  `, () => {
    document.getElementById('delete-confirm-btn').onclick = () => {
      const works = getSavedWorks().filter(w => w.id !== id);
      localStorage.setItem('pixelArt_savedWorks', JSON.stringify(works));
      if (state.currentWorkId === id) state.currentWorkId = null;
      autoSave();
      closeDialog();
      showToast(t('toastDeleted'));
      // Refresh load dialog if open
      setTimeout(() => openLoadDialog(), 300);
    };
  });
}

function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  const empty = document.getElementById('gallery-empty');
  const works = getSavedWorks().slice().reverse();
  if (!grid) return;

  if (works.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = works.map(w => {
    const wW = w.canvasWidth || w.canvasSize || 64;
    const wH = w.canvasHeight || w.canvasSize || 64;
    const date = new Date(w.updatedAt);
    const dateStr = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    return '<div class="gallery-card" data-id="' + w.id + '">' +
      '<canvas width="50" height="50" class="gallery-thumb"></canvas>' +
      '<div class="card-name">' + escHtml(w.name) + '</div>' +
      '<div class="card-info">' + wW + '×' + wH + ' · ' + dateStr + '</div>' +
      '<div class="card-actions">' +
        '<button class="edit-btn" data-edit="' + w.id + '">✏️</button>' +
        '<button class="del" data-del="' + w.id + '">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join('');

  // Render thumbnails
  grid.querySelectorAll('.gallery-thumb').forEach(canvas => {
    const card = canvas.closest('.gallery-card');
    const wid = card.getAttribute('data-id');
    const w = works.find(x => x.id === wid);
    if (w) renderThumb(canvas, w);
  });

  // Click handlers
  grid.querySelectorAll('.gallery-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.del') || e.target.closest('.edit-btn')) return;
      const wid = card.getAttribute('data-id');
      loadWork(wid);
      goToEditor();
    });
  });
  grid.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wid = btn.getAttribute('data-edit');
      loadWork(wid);
      goToEditor();
    });
  });
  grid.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wid = btn.getAttribute('data-del');
      deleteWorkFromGallery(wid);
    });
  });
}

function autoFitZoom() {
  // Calculate optimal zoom so canvas fits screen
  const maxW = window.innerWidth - 20;  // 10px padding each side
  const maxH = window.innerHeight - 180; // header + toolbar + footer + palette
  const fitW = Math.floor(maxW / state.canvasWidth);
  const fitH = Math.floor(maxH / state.canvasHeight);
  const autoZoom = Math.max(2, Math.min(fitW, fitH));
  return autoZoom;
}

function goToEditor() {
  state.currentPage = 'editor';
  document.getElementById('gallery-page').classList.add('hidden');
  document.getElementById('editor-page').classList.remove('hidden');
  // Auto-fit zoom on mobile
  if (window.innerWidth <= 768) {
    state.zoom = autoFitZoom();
  }
  resizeCanvas();
  renderCanvas();
  setZoom(state.zoom);
  setBrushSize(state.brushSize);
  initBrushDots();
  autoSave();
}

function resizeCanvasKeepPixels(newWidth, newHeight) {
  const oldPixels = state.pixels;
  const oldW = state.canvasWidth, oldH = state.canvasHeight;
  state.canvasWidth = newWidth;
  state.canvasHeight = newHeight;
  state.pixels = [];
  for (let r = 0; r < newHeight; r++) {
    state.pixels[r] = new Array(newWidth).fill(null);
    for (let c = 0; c < newWidth; c++) {
      if (r < oldH && c < oldW && oldPixels[r] && oldPixels[r][c]) {
        state.pixels[r][c] = oldPixels[r][c];
      }
    }
  }
  state.history = [];
  state.historyIndex = -1;
  saveHistory();
  if (window.innerWidth <= 768) state.zoom = autoFitZoom();
  resizeCanvas();
  renderCanvas();
  setZoom(state.zoom);
  autoSave();
}

// ================================================================
//  DRAWING EVENT HANDLERS
// ================================================================
let isDrawing = false;
let lastDrawnPixel = null;
let isPanning = false;
let panStartX = 0, panStartY = 0;
let panStartScrollX = 0, panStartScrollY = 0;

function getTouchMidpoint(touches) {
  let x = 0, y = 0;
  for (let i = 0; i < touches.length; i++) {
    x += touches[i].clientX;
    y += touches[i].clientY;
  }
  return { x: x / touches.length, y: y / touches.length };
}

function startDraw(e) {
  // Two-finger pan
  if (e.touches && e.touches.length === 2) {
    e.preventDefault();
    isDrawing = false;
    isPanning = true;
    const mid = getTouchMidpoint(e.touches);
    panStartX = mid.x;
    panStartY = mid.y;
    panStartScrollX = $canvasArea.scrollLeft;
    panStartScrollY = $canvasArea.scrollTop;
    return;
  }
  // Single finger draw
  e.preventDefault();
  const pos = getPixelFromEvent(e);
  if (!pos) return;
  isDrawing = true;
  isPanning = false;
  lastDrawnPixel = pos;
  if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
    saveHistory();
  }
  useToolAt(pos.row, pos.col);
  renderCanvas();
}

function moveDraw(e) {
  // Two-finger pan
  if (isPanning && e.touches && e.touches.length === 2) {
    e.preventDefault();
    const mid = getTouchMidpoint(e.touches);
    const dx = mid.x - panStartX;
    const dy = mid.y - panStartY;
    $canvasArea.scrollLeft = panStartScrollX - dx;
    $canvasArea.scrollTop = panStartScrollY - dy;
    return;
  }
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPixelFromEvent(e);
  if (!pos) return;
  if (lastDrawnPixel && lastDrawnPixel.row === pos.row && lastDrawnPixel.col === pos.col) return;
  lastDrawnPixel = pos;
  if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
    drawAt(pos.row, pos.col);
    renderCanvas();
  }
}

function endDraw(e) {
  if (isPanning) {
    isPanning = false;
    return;
  }
  if (!isDrawing) return;
  isDrawing = false;
  lastDrawnPixel = null;
  if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
    renderCanvas();
    autoSave();
  }
}

// Mouse events (desktop)
$mainCanvas.addEventListener('mousedown', startDraw);
$mainCanvas.addEventListener('mousemove', moveDraw);
$mainCanvas.addEventListener('mouseup', endDraw);
$mainCanvas.addEventListener('mouseleave', endDraw);

// Touch events (mobile)
$mainCanvas.addEventListener('touchstart', startDraw, { passive: false });
$mainCanvas.addEventListener('touchmove', moveDraw, { passive: false });
$mainCanvas.addEventListener('touchend', endDraw);
$mainCanvas.addEventListener('touchcancel', endDraw);

// Single click for fill/picker
$mainCanvas.addEventListener('click', (e) => {
  // Only handle single clicks for tools that don't use drag
  if (state.currentTool === 'fill' || state.currentTool === 'picker') {
    const pos = getPixelFromEvent(e);
    if (pos) {
      useToolAt(pos.row, pos.col);
      renderCanvas();
      if (state.currentTool === 'fill') autoSave();
    }
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
    else if (e.key === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 's') { e.preventDefault(); saveWork(); }
    else if (e.key === 'e') { e.preventDefault(); exportPNG(); }
    else if (e.key === 'n') { e.preventDefault(); openNewDialog(); }
    return;
  }
  // Tool shortcuts (only in editor, not in input fields)
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key.toLowerCase()) {
    case 'p': switchTool('pen'); break;
    case 'e': switchTool('eraser'); break;
    case 'f': switchTool('fill'); break;
    case 'i': switchTool('picker'); break;
    case 'g': $gridToggle.checked = !$gridToggle.checked; toggleGrid(); break;
    case '1': setBrushSize(1); break;
    case '2': setBrushSize(2); break;
    case '3': setBrushSize(3); break;
    case '4': setBrushSize(4); break;
    case '[': setZoom(Math.max(2, state.zoom / 2)); break;
    case ']': setZoom(Math.min(32, state.zoom * 2)); break;
    case 'escape': if (state.currentPage === 'editor') goToGallery(); break;
  }
});

// Wheel zoom on canvas
$mainCanvas.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    if (e.deltaY < 0) setZoom(Math.min(32, state.zoom * 2));
    else setZoom(Math.max(2, state.zoom / 2));
  }
}, { passive: false });

// ================================================================
//  TUTORIAL
// ================================================================
const tutorialSteps = [
  { selector: '#toolbar, #mobile-toolbar', textKey: 'tutorialStep1', position: 'right' },
  { selector: '.brush-size-section, .mobile-brush-sizes', textKey: 'tutorialStep2', position: 'right' },
  { selector: '#palette-panel, #mobile-palette', textKey: 'tutorialStep3', position: 'left' },
  { selector: '#canvas-area', textKey: 'tutorialStep4', position: 'center' },
  { selector: '#toolbar button[data-i18n-title=\"toolUndo\"], #mobile-toolbar button[data-i18n-title=\"toolUndo\"]', textKey: 'tutorialStep5', position: 'right' },
  { selector: '#footer', textKey: 'tutorialStep6', position: 'top' },
  { selector: '#header .actions button[data-i18n=\"btnSave\"]', textKey: 'tutorialStep7', position: 'bottom' },
  { selector: '#header .actions button[data-i18n=\"btnLoad\"]', textKey: 'tutorialStep8', position: 'bottom' },
  { selector: '#header .actions button[data-i18n=\"btnNew\"]', textKey: 'tutorialStep9', position: 'bottom' },
  { selector: '#header .actions button.primary', textKey: 'tutorialStep10', position: 'bottom' },
  { selector: '#header .back-btn', textKey: 'tutorialStep11', position: 'bottom' },
  { selector: '#header .actions button.icon-btn', textKey: 'tutorialStep12', position: 'bottom' },
];

let tutorialStep = 0;

function startTutorial() {
  tutorialStep = 0;
  $tutorialOverlay.classList.add('show');
  showTutorialStep();
}

function showTutorialStep() {
  if (tutorialStep >= tutorialSteps.length) {
    endTutorial();
    return;
  }
  const step = tutorialSteps[tutorialStep];
  const selector = step.selector.split(',')[0].trim(); // Use first selector
  const target = document.querySelector(selector);

  if (!target) {
    // Fallback: try mobile version
    const mobileSel = step.selector.split(',')[1]?.trim();
    const mobileTarget = mobileSel ? document.querySelector(mobileSel) : null;
    if (mobileTarget) {
      positionTutorial(mobileTarget, step);
    } else {
      tutorialStep++;
      showTutorialStep();
    }
    return;
  }
  positionTutorial(target, step);
}

function positionTutorial(target, step) {
  const rect = target.getBoundingClientRect();
  const overlayRect = $tutorialOverlay.getBoundingClientRect();

  // Highlight
  $tutorialHighlight.style.display = 'block';
  $tutorialHighlight.style.top = rect.top + 'px';
  $tutorialHighlight.style.left = rect.left + 'px';
  $tutorialHighlight.style.width = rect.width + 'px';
  $tutorialHighlight.style.height = rect.height + 'px';

  // Bubble
  const stepNum = tutorialStep + 1;
  const totalSteps = tutorialSteps.length;
  $tutorialBubble.innerHTML = `
    <div style="font-size:12px;color:var(--text-light);margin-bottom:2px;">${t('tutorialTitle')} · ${stepNum}/${totalSteps}</div>
    <p>${t(step.textKey)}</p>
    <div class="btn-row">
      <button class="btn-skip" id="tut-skip">${t('tutorialSkip')}</button>
      <button class="btn-next" id="tut-next">${tutorialStep < totalSteps - 1 ? t('tutorialNext') : t('tutorialDone')}</button>
    </div>
  `;
  $tutorialBubble.classList.add('show');

  // Position bubble based on step.position
  let bubbleTop, bubbleLeft;
  const bubbleEl = $tutorialBubble;
  const bubbleW = 300;
  const bubbleH = 150;

  switch(step.position) {
    case 'right':
      bubbleTop = rect.top + rect.height/2 - bubbleH/2;
      bubbleLeft = rect.right + 16;
      break;
    case 'left':
      bubbleTop = rect.top + rect.height/2 - bubbleH/2;
      bubbleLeft = rect.left - bubbleW - 16;
      break;
    case 'bottom':
      bubbleTop = rect.bottom + 16;
      bubbleLeft = rect.left + rect.width/2 - bubbleW/2;
      break;
    default: // center
      bubbleTop = rect.top + rect.height/2 - bubbleH/2;
      bubbleLeft = rect.left + rect.width/2 - bubbleW/2;
  }

  // Clamp to viewport
  bubbleTop = Math.max(10, Math.min(bubbleTop, window.innerHeight - bubbleH - 10));
  bubbleLeft = Math.max(10, Math.min(bubbleLeft, window.innerWidth - bubbleW - 10));

  $tutorialBubble.style.top = bubbleTop + 'px';
  $tutorialBubble.style.left = bubbleLeft + 'px';

  // Events
  document.getElementById('tut-skip').onclick = endTutorial;
  document.getElementById('tut-next').onclick = () => {
    tutorialStep++;
    showTutorialStep();
  };
}

function endTutorial() {
  $tutorialOverlay.classList.remove('show');
  $tutorialHighlight.style.display = 'none';
  $tutorialBubble.classList.remove('show');
  localStorage.setItem('pixelArt_tutorialDone', 'true');
}

// ================================================================
//  LOADING ANIMATION — Pixel Cat
// ================================================================
// Cat frames: 16x12 each, encoded as strings
// chars: ' '=transparent, '1'=black, '2'=dark gray, '3'=white(eye), '4'=pink(ear)
// Cat image for loading animation
let catImage = null;
let catX = -80;
let catAnimId = null;
let dustParticles = [];
let catDirection = 1; // 1 = right, -1 = left

function loadCatImage() {
  catImage = new Image();
  catImage.src = 'black cat.jpg';
}

function generateDust() {
  dustParticles = [];
  for (let i = 0; i < 8; i++) {
    dustParticles.push({
      x: Math.random() * 30 - 10,
      y: Math.random() * 6 - 2,
      life: Math.random() * 0.6 + 0.2,
      size: Math.random() * 3 + 1,
    });
  }
}

function animateCat() {
  const canvas = document.getElementById('loading-cat-canvas');
  if (!canvas || $loading.classList.contains('hidden')) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Fill canvas background to match app theme
  ctx.fillStyle = '#FFF8F0';
  ctx.fillRect(0, 0, w, h);
  const groundY = 105;
  const catH = 70; // display height of cat
  const catW = catH * (catImage ? catImage.width / catImage.height : 1);

  // Bounce: cat bobs up and down while running
  const bounce = Math.abs(Math.sin(Date.now() / 120)) * 6;
  const catDrawY = groundY - catH + bounce;

  // Ground shadow (scales with bounce — smaller when cat is higher)
  const shadowScale = 1 - bounce / 20;
  ctx.fillStyle = 'rgba(74,48,40,0.08)';
  ctx.beginPath();
  ctx.ellipse(catX + catW/2, groundY + 4, catW * 0.35 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dust particles
  dustParticles.forEach(p => {
    p.life -= 0.015;
    p.y -= 0.4;
    if (p.life <= 0) {
      p.life = Math.random() * 0.6 + 0.2;
      p.x = Math.random() * 25 - 5;
      p.y = Math.random() * 4 - 2;
    }
    ctx.fillStyle = 'rgba(180,150,130,' + p.life + ')';
    ctx.fillRect(catX + p.x, groundY + p.y, p.size, p.size);
  });

  // Draw cat image
  if (catImage && catImage.complete) {
    ctx.save();
    if (catDirection === -1) {
      // Flip horizontally when running left
      ctx.translate(catX + catW, catDrawY);
      ctx.scale(-1, 1);
      ctx.drawImage(catImage, 0, 0, catW, catH);
    } else {
      ctx.drawImage(catImage, catX, catDrawY, catW, catH);
    }
    ctx.restore();
  } else {
    // Fallback: draw a placeholder silhouette
    ctx.fillStyle = '#3A2A2A';
    ctx.beginPath();
    ctx.ellipse(catX + catW/2, catDrawY + catH/2, catW/2.5, catH/2.2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Advance position
  const speed = 2;
  catX += speed * catDirection;

  // Reverse direction at edges
  if (catX > w - catW - 10) {
    catDirection = -1;
    generateDust();
  } else if (catX < 10) {
    catDirection = 1;
    generateDust();
  }

  catAnimId = requestAnimationFrame(animateCat);
}

// ================================================================
//  INIT
// ================================================================
function init() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

  // Restore auto-saved state or create new
  const restored = restoreAutoSave();
  if (!restored || !state.pixels || state.pixels.length === 0) {
    initPixels(64, 64, '#FFFFFF');
  }

  setColor(state.currentColor);
  setBrushSize(state.brushSize || 1);
  initBrushDots();
  resizeCanvas();
  renderCanvas();
  renderPresetSwatches();
  updateAllTexts();

  // Update zoom button state
  document.querySelectorAll('#footer .zoom-btns button').forEach(b => {
    b.classList.toggle('current', parseInt(b.getAttribute('data-zoom')) === state.zoom);
  });
  $gridToggle.checked = state.showGrid;

  // Loading animation
  loadCatImage();
  generateDust();
  animateCat();

  // Hide loading, show gallery page
  setTimeout(() => {
    $loading.classList.add('hidden');
    state.currentPage = 'gallery';
    document.getElementById('gallery-page').classList.remove('hidden');
    renderGallery();
    // Stop animation after fade
    setTimeout(() => {
      if (catAnimId) cancelAnimationFrame(catAnimId);
    }, 600);
  }, 1800);

  // Language selection for first-time users
  const langChosen = localStorage.getItem('pixelArt_langChosen');
  const tutorialDone = localStorage.getItem('pixelArt_tutorialDone');

  if (!langChosen) {
    // First time ever: show language selection, then tutorial
    setTimeout(() => {
      document.getElementById('lang-select-overlay').classList.remove('hidden');
    }, 2000);
  } else if (!tutorialDone) {
    // Returning user who skipped tutorial: ask again
    setTimeout(() => startTutorial(), 2500);
  }

  // PWA: Register Service Worker
  registerSW();

  // PWA: Install prompt
  setupInstallPrompt();
}

// ================================================================
//  PWA — Service Worker Registration
// ================================================================
function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✅ SW registered:', reg.scope))
      .catch(err => console.log('SW registration skipped:', err.message));
  }
}

// ================================================================
//  PWA — Install Prompt
// ================================================================
let deferredPrompt = null;

function setupInstallPrompt() {
  const $installPrompt = document.getElementById('install-prompt');
  const $installBtn = document.getElementById('install-btn');
  const $installClose = document.getElementById('install-close');
  const $installText = document.getElementById('install-text');

  // Listen for beforeinstallprompt
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Show install prompt after loading
    setTimeout(() => {
      if ($installPrompt) {
        $installPrompt.classList.add('show');
        if ($installText) $installText.textContent = t('installDesc');
        if ($installBtn) $installBtn.textContent = t('installBtn');
      }
    }, 3000);
  });

  // Install button
  if ($installBtn) {
    $installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Install outcome:', outcome);
      deferredPrompt = null;
      if ($installPrompt) $installPrompt.classList.remove('show');
    });
  }

  // Close button
  if ($installClose) {
    $installClose.addEventListener('click', () => {
      if ($installPrompt) $installPrompt.classList.remove('show');
    });
  }

  // Hide prompt if app is already installed
  window.addEventListener('appinstalled', () => {
    if ($installPrompt) $installPrompt.classList.remove('show');
    deferredPrompt = null;
    showToast(lang === 'zh' ? '✅ 安装成功！' : '✅ Installed successfully!');
  });
}

// Start the app
init();
</script>
</body>
</html>
